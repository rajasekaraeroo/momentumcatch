# Live tick-engine momentum configuration (SPEC §5).
windows:
  fastSec: 5
  slowSec: 30
  oiSec: 60
  baselineSec: 300
  openExclusionSec: 300      # first 5 min excluded from baselines

weights:                     # renormalized if a component is unavailable
  velocity: 0.35
  acceleration: 0.15
  volumeBurst: 0.30
  flowImbalance: 0.20

caps:
  volumeBurstZ: 6

floors:                      # std floors so quiet/opening windows can't blow up z-scores (§4)
  retVol: 0.0002             # per-second |log return| floor
  volStd: 1                  # per-second volume std floor (contracts)

underlyingConfirmation:
  min: 0.5
  max: 1.5

liquidityGate:
  minVol5s: 50               # contracts; tune per underlying
  maxSpreadPct: 1.5          # of premium

emission:
  scoreThreshold: 70
  rearmBelow: 50
  cooldownSec: 60

lifecycle:                   # SPEC §14
  decayWeights:
    accelerationReversal: 0.25
    volumeFade: 0.20
    extremeStall: 0.20
    pullbackDepth: 0.15
    flowFlip: 0.10
    underlyingDivergence: 0.10
  accelReversalStepsFull: 5
  volumeFadeFloorRatio: 0.3
  stallBudgetSec: 45
  flowFlipStepsFull: 10   # §14.2.5 opposite-flow steps for full flow-flip score
  pullbackAtrK: 1.5
  peakConfirmSteps: 10
  fadingAt: 50
  reigniteBelow: 30
  deadAt: 75
  deadScoreFloor: 35
  maxEpisodeSec: 900

focusPool:                   # §12.8 D30 focus pool (Upstox Plus)
  enabled: false             # false → byte-identical pre-Plus D5-only behavior
  capacity: 50               # full_d30 instruments per connection (Plus limit)
  demotionCooldownSec: 60    # keep D30 after MomentumDead until cooldown expires
  imbalanceLambda: 0.25      # §5.5 distance decay: w_i = exp(-lambda * i)
  emaWarmupSec: 10           # flow smoother warming period after a depth switch
