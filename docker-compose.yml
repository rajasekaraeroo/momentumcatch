# One-command MomentumScan:  docker compose up -d --build
# Runs everything — engine (:3001), dashboard (:3000), PostgreSQL, Redis.
# Only Docker Desktop is required on the machine; Node/pnpm/Git are only
# needed for development. Credentials come from .env (see .env.example).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: momentum
      POSTGRES_PASSWORD: momentum
      POSTGRES_DB: momentumscan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U momentum"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  engine:
    build:
      context: .
      dockerfile: apps/engine/Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      # inside the compose network the databases are reachable by service
      # name, not localhost — these override whatever .env says
      DATABASE_URL: postgresql://momentum:momentum@postgres:5432/momentumscan
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    volumes:
      # persist on the host: edited configs, the downloaded proto contract,
      # recorded ticks (Track B) and backtest reports
      - ./config:/app/config
      - ./packages/shared/proto:/app/packages/shared/proto
      - ./data:/app/data
      - ./reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - engine
    restart: unless-stopped

volumes:
  pgdata:
